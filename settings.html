<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings - Fashion Store</title>

<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>


<!-- =========================
     SIDEBAR
========================== -->

<aside class="sidebar" id="sidebar">


    <!-- CLOSE BUTTON -->

    <button class="close-btn" id="close-btn" type="button">

        <i class="fa-solid fa-xmark"></i>

    </button>



    <!-- STORE NAME -->

    <h1>

        <i class="fa-solid fa-shirt"></i>

        Fashion Store

    </h1>



    <!-- SIDEBAR MENU -->

    <ul>


        <!-- DASHBOARD -->

        <li>

            <a href="index.html">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>

        </li>



        <!-- PRODUCTS -->

        <li>

            <a href="products.html">

                <i class="fa-solid fa-box"></i>

                <span>Products</span>

            </a>

        </li>



        <!-- ORDERS -->

        <li>

            <a href="orders.html">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>Orders</span>

            </a>

        </li>



        <!-- ANALYTICS -->

        <li>

            <a href="analytics.html">

                <i class="fa-solid fa-chart-line"></i>

                <span>Analytics</span>

            </a>

        </li>



        <!-- SALES -->

        <li>

            <a href="sales.html">

                <i class="fa-solid fa-chart-column"></i>

                <span>Sales</span>

            </a>

        </li>



        <!-- CUSTOMERS -->

        <li>

            <a href="customers.html">

                <i class="fa-solid fa-users"></i>

                <span>Customers</span>

            </a>

        </li>



        <!-- REVIEWS -->

        <li>

            <a href="reviews.html">

                <i class="fa-solid fa-star"></i>

                <span>Reviews</span>

            </a>

        </li>



        <!-- SETTINGS -->

        <li>

            <a href="settings.html" class="active">

                <i class="fa-solid fa-gear"></i>

                <span>Settings</span>

            </a>

        </li>


    </ul>


</aside>




<!-- =========================
     MAIN CONTENT
========================== -->

<main class="main">


    <!-- =========================
         MOBILE HAMBURGER
    ========================== -->

    <button class="menu-btn" id="menu-btn" type="button">

        <i class="fa-solid fa-bars"></i>

    </button>




    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">


        <div class="navbar-left">

            <h2>Settings</h2>

        </div>



        <div class="navbar-right">


            <i class="fa-solid fa-bell"></i>


            <div class="admin-info">

                <i class="fa-solid fa-user"></i>

                <span>Admin</span>

            </div>


        </div>


    </nav>




    <!-- =========================
         PAGE CONTENT
    ========================== -->

    <div class="page">


        <h1>Settings</h1>


        <p class="subtitle">

            Manage your store settings.

        </p>




        <!-- =========================
             STORE INFORMATION
        ========================== -->

        <div class="settings-box">


            <h2>Store Information</h2>


            <div class="setting-field">

                <label for="store-name">
                    Store Name
                </label>

                <input
                    type="text"
                    id="store-name"
                    value="Fashion Store"
                >

            </div>



            <div class="setting-field">

                <label for="store-email">
                    Email
                </label>

                <input
                    type="email"
                    id="store-email"
                    value="fashion@gmail.com"
                >

            </div>



            <div class="setting-field">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    value="+92 300 1234567"
                >

            </div>



            <div class="setting-field">

                <label for="address">
                    Store Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                >Pakistan</textarea>

            </div>



            <button class="save-btn" type="button">

                Save Changes

            </button>


        </div>




        <!-- =========================
             ACCOUNT SETTINGS
        ========================== -->

        <div class="settings-box">


            <h2>Account Settings</h2>


            <div class="setting-field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    value="admin"
                >

            </div>



            <div class="setting-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    value="12345678"
                >

            </div>



            <button class="save-btn" type="button">

                Update Account

            </button>


        </div>


    </div>


</main>




<!-- =========================
     JAVASCRIPT
========================== -->

<script src="script.js"></script>


</body>

</html>
