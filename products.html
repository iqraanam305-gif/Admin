<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products - Fashion Store</title>

<!-- Main CSS -->
<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>

<!-- =========================================
     HAMBURGER BUTTON
========================================== -->

<button class="menu-btn" id="menuBtn" type="button">
    <i class="fa-solid fa-bars"></i>
</button>



<!-- =========================================
     SIDEBAR
========================================== -->

<aside class="sidebar" id="sidebar">


    <!-- CLOSE BUTTON -->

    <button class="close-btn" id="closeBtn" type="button">
        <i class="fa-solid fa-xmark"></i>
    </button>



    <!-- STORE NAME -->

    <h1>
        <i class="fa-solid fa-shirt"></i>
        Fashion Store
    </h1>



    <!-- NAVIGATION -->

    <ul>


        <li>
            <a href="admin.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>


        <li>
            <a href="products.html" class="active">
                <i class="fa-solid fa-box"></i>
                <span>Products</span>
            </a>
        </li>


        <li>
            <a href="orders.html">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Orders</span>
            </a>
        </li>


        <li>
            <a href="analytics.html">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span>
            </a>
        </li>


        <li>
            <a href="sales.html">
                <i class="fa-solid fa-chart-column"></i>
                <span>Sales</span>
            </a>
        </li>


        <li>
            <a href="customers.html">
                <i class="fa-solid fa-users"></i>
                <span>Customers</span>
            </a>
        </li>


        <li>
            <a href="reviews.html">
                <i class="fa-solid fa-star"></i>
                <span>Reviews</span>
            </a>
        </li>


        <li>
            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </li>


    </ul>

</aside>



<!-- =========================================
     MAIN CONTENT
========================================== -->

<main class="main">



    <!-- NAVBAR -->

    <nav class="navbar">


        <div class="navbar-left">

            <h2>Products</h2>

        </div>



        <div class="navbar-center">

            <input type="text" placeholder="Search Product">

        </div>



        <div class="navbar-right">

            <button type="button">Admin</button>

        </div>


    </nav>



    <!-- =========================================
         PRODUCT HEADING
    ========================================== -->

    <section class="product-heading">


        <h2>All Products</h2>


        <button class="add-btn" type="button">
            + Add Product
        </button>


    </section>



    <!-- =========================================
         FILTERS
    ========================================== -->

    <section class="filters">


        <input
            type="text"
            placeholder="Search product"
        >


        <select>

            <option>All Categories</option>

            <option>Men</option>

            <option>Women</option>

            <option>Shoes</option>

            <option>Accessories</option>

        </select>


    </section>



    <!-- =========================================
         PRODUCT TABLE
    ========================================== -->

    <section class="product-table">


        <table>


            <tr>

                <th>Product</th>

                <th>Category</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Action</th>

            </tr>



            <tr>

                <td>Oversized Hoodie</td>

                <td>Men</td>

                <td>$120</td>

                <td>25</td>

                <td>

                    <button class="edit" type="button">
                        Edit
                    </button>

                    <button class="delete" type="button">
                        Delete
                    </button>

                </td>

            </tr>



            <tr>

                <td>Wide Leg Jeans</td>

                <td>Women</td>

                <td>$95</td>

                <td>40</td>

                <td>

                    <button class="edit" type="button">
                        Edit
                    </button>

                    <button class="delete" type="button">
                        Delete
                    </button>

                </td>

            </tr>



            <tr>

                <td>Classic Sneakers</td>

                <td>Shoes</td>

                <td>$150</td>

                <td>12</td>

                <td>

                    <button class="edit" type="button">
                        Edit
                    </button>

                    <button class="delete" type="button">
                        Delete
                    </button>

                </td>

            </tr>



            <tr>

                <td>Shoulder Bag</td>

                <td>Accessories</td>

                <td>$80</td>

                <td>30</td>

                <td>

                    <button class="edit" type="button">
                        Edit
                    </button>

                    <button class="delete" type="button">
                        Delete
                    </button>

                </td>

            </tr>


        </table>

    </section>


</main>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>

</html>
