<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - FashionLabs</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="sidebar">

        <h1>FashionLabs</h1>

        <ul>
            <li>
                <a href="index.html">Dashboard</a>
            </li>
            <li>
                <a href="products.html">Products</a>
            </li>
            <li>Orders</li>
            <li>Analytics</li>
            <li>Sales</li>
            <li>Customers</li>
            <li>Reviews</li>
            <li>Settings</li>
        </ul>

    </div>



    

    <div class="main">


    

        <div class="navbar">

            <h2>Products</h2>

            <input type="text" placeholder="Search Product">

            <button>Admin</button>

        </div>



    

        <div class="product-heading">

            <h2>All Products</h2>

            <button class="add-btn">+ Add Product</button>

        </div>



        

        <div class="filters">

            <input type="text" placeholder="Search product">

            <select>

                <option>All Categories</option>

                <option>Men</option>

                <option>Women</option>

                <option>Shoes</option>

                <option>Accessories</option>

            </select>

        </div>



       

        <div class="product-table">

            <table>

                <tr>

                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>

                </tr>


                <tr>


                    <td>Oversized Hoodie</td>

                    <td>Men</td>

                    <td>$120</td>

                    <td>25</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>

                </tr>


                <tr>

                    <td>Wide Leg Jeans</td>

                    <td>Women</td>

                    <td>$95</td>

                    <td>40</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>

                </tr>


                <tr>

                    <td>Classic Sneakers</td>

                    <td>Shoes</td>

                    <td>$150</td>

                    <td>12</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>

                </tr>


                <tr>

                    <td>Shoulder Bag</td>

                    <td>Accessories</td>

                    <td>$80</td>

                    <td>30</td>

                    <td>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>

                </tr>

            </table>

        </div>

</body>

</html>
